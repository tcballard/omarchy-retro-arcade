[package]
name = "omarchy-minesweeper"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Minesweeper for Omarchy Arcade"

[dependencies]
arcade-presentation = { path = "../../shared/presentation" }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
omarchy-chess = { path = "../chess" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tempfile = "3"
