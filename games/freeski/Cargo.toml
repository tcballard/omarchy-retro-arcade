[package]
name = "omarchy-freeski"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"
description = "Original downhill skiing inside Omarchy Arcade"

[features]
default = ["ui"]
ui = ["dep:eframe", "dep:arcade-presentation", "dep:omarchy-chess"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"], optional = true }
arcade-presentation = { path = "../../shared/presentation", optional = true }
omarchy-chess = { path = "../chess", optional = true }
