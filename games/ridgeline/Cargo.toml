[package]
name = "omarchy-ridgeline"
version.workspace = true
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:arcade-presentation", "dep:arcade-platform"]

[dependencies]
arcade-presentation = { path = "../../shared/presentation", optional = true }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"], optional = true }
arcade-platform = { path = "../../shared/platform", features = ["theme"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
