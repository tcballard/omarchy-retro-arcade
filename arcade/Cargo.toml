[package]
name = "omarchy-retro-arcade"
version.workspace = true
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-or-later"

[dependencies]
arcade-presentation = { path = "../shared/presentation" }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui_extras = { version = "=0.31.1", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
omarchy-chess = { path = "../games/chess" }
omarchy-solitaire = { path = "../games/solitaire" }
omarchy-scram = { path = "../games/scram" }
omarchy-invaders = { path = "../games/invaders" }
omarchy-stack = { path = "../games/stack" }
omarchy-snake = { path = "../games/snake" }
omarchy-blast = { path = "../games/blast" }
fs2 = "0.4"
omarchy-bubble = { path = "../games/bubble" }

omarchy-2048 = { path = "../games/2048" }

[dev-dependencies]
tempfile = "3"
